\name: NestJS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Debug environment
        run: |
          echo "=== Node ==="
          node --version

          echo "=== npm ==="
          npm --version

          echo "=== Commit ==="
          git rev-parse HEAD

          echo "=== Lockfile ==="
          grep '"lockfileVersion"' package-lock.json

          echo "=== package.json NestJS ==="
          grep '"@nestjs/core"\|"@nestjs/platform-express"' package.json

          echo "=== AJV in lockfile ==="
          grep -n '"node_modules/ajv"' package-lock.json | head

          echo "=== AJV versions ==="
          npm ls ajv --all || true

      - name: Install dependencies
        run: .github/workflows/ci.yml

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
