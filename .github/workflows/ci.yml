name: NestJS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Debug environment
        run: |
          echo "=== Node ==="
          node --version

          echo "=== npm ==="
          npm --version

          echo "=== Commit ==="
          git rev-parse HEAD

          echo "=== Lockfile ==="
          grep '"lockfileVersion"' package-lock.json

          echo "=== package.json NestJS ==="
          grep '"@nestjs/core"\|"@nestjs/platform-express"' package.json

          echo "=== AJV in lockfile ==="
          grep -n '"node_modules/ajv"' package-lock.json | head

          echo "=== AJV versions ==="
          npm ls ajv --all || true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 to known hosts
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            cd ~/node

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            npm ci --legacy-peer-deps

            echo "Building application..."
            npm run build

            echo "Restarting PM2..."
            pm2 restart nestjs-crud

            echo "Deployment completed!"
          EOF


